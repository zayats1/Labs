# Root Logger
rootLogger=DEBUG, STDOUT, LOGFILE, SMTP

# Direct log messages to STDOUT
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n

# Direct to a file
appender.file.type = File
appender.file.name = LOGFILE
appender.file.fileName = logs/main.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n
appender.file.filter.threshold.type = ThresholdFilter
appender.file.filter.threshold.level = info

# to email
appender.E1 = org.apache.log4j2.net.SMTPAppender
appender.E1.name = SMTP
appender.E1.type = Console
appender.E1.Threshold = ERROR
appender.E1.layout = PatternLayout
appender.E1.From = test@logging.apache.org
appender.E1.SMTPHost = aspmx.l.google.com
appender.E1.Subject = "Testing Log4j Mail Notification"
appender.E1.To = zaiats.bogdan@gmail.com